name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-multimedia-dev \
            libgl1-mesa-dev \
            libglvnd-dev \
            libsdl2-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGECKO_BUILD_DESKTOP=ON \
            -DGECKO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run host tests
        run: ./build/bin/gecko-host-tests

      - name: Run GUI selftest
        run: |
          QT_QPA_PLATFORM=offscreen ./build/bin/gecko --selftest ./build/bin/gecko_testcore.so ./selftest-out

      - name: Package Linux release
        run: |
          mkdir -p dist/gecko-linux-x86_64
          cp build/bin/gecko dist/gecko-linux-x86_64/
          cp build/bin/gecko-host-tests dist/gecko-linux-x86_64/
          cp build/bin/gecko_testcore.so dist/gecko-linux-x86_64/
          cp README.md LICENSE NOTICE.md dist/gecko-linux-x86_64/
          tar -czvf gecko-linux-x86_64.tar.gz -C dist gecko-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gecko-linux-x86_64
          path: gecko-linux-x86_64.tar.gz

  build-windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DGECKO_BUILD_DESKTOP=ON `
            -DGECKO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run host tests
        run: .\build\bin\gecko-host-tests.exe

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\gecko-windows-x64
          Copy-Item build\bin\gecko.exe dist\gecko-windows-x64\
          Copy-Item build\bin\gecko-host-tests.exe dist\gecko-windows-x64\
          Copy-Item build\bin\gecko_testcore.dll dist\gecko-windows-x64\
          Copy-Item README.md, LICENSE, NOTICE.md dist\gecko-windows-x64\
          windeployqt --release --no-translations --compiler-runtime dist\gecko-windows-x64\gecko.exe
          Compress-Archive -Path dist\gecko-windows-x64 -DestinationPath gecko-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gecko-windows-x64
          path: gecko-windows-x64.zip

  build-macos:
    name: macOS (Universal / arm64 & x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt@6 sdl2 ninja
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DGECKO_BUILD_DESKTOP=ON \
            -DGECKO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Run host tests
        run: ./build/bin/gecko-host-tests

      - name: Package macOS release
        run: |
          macdeployqt build/bin/gecko.app -always-overwrite
          mkdir -p dist
          cp -R build/bin/gecko.app dist/
          cp README.md LICENSE NOTICE.md dist/
          ditto -c -k --sequentially --keepParent dist/gecko.app gecko-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gecko-macos
          path: gecko-macos.zip

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check JNI bridge syntax
        run: bash scripts/check-android-jni.sh

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease || ./gradlew :app:assembleDebug

      - name: Package Android APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk gecko-android.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk gecko-android.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk gecko-android.apk
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gecko-android
          path: gecko-android.apk

  release:
    name: Release on Tag
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-windows
      - build-macos
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/gecko-linux-x86_64.tar.gz
            artifacts/gecko-windows-x64.zip
            artifacts/gecko-macos.zip
            artifacts/gecko-android.apk
          generate_release_notes: true
